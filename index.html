<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <title>体操競技 Dスコア計算システム</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1067083755252901"
     crossorigin="anonymous"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('[SW] Registered:', reg.scope))
                    .catch(err => console.warn('[SW] Registration failed:', err));
            });
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .gender-buttons {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gender-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 2rem 3rem;
            font-size: 1.5rem;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            font-weight: bold;
        }

        .gender-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            background: #f8f9fa;
        }

        .gender-btn:active {
            transform: translateY(-2px);
        }

        .emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .description {
            color: white;
            margin-top: 3rem;
            font-size: 1rem;
            opacity: 0.9;
            max-width: 600px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .gender-btn {
                padding: 1.5rem 2.5rem;
                font-size: 1.2rem;
            }

            .emoji {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤸 体操競技 Dスコア計算システム</h1>

        <div class="gender-buttons">
            <a href="women.html" class="gender-btn">
                <span class="emoji">🤸‍♀️</span>
                女子体操
            </a>
            <a href="men.html" class="gender-btn">
                <span class="emoji">🤸‍♂️</span>
                男子体操
            </a>
        </div>

        <div class="description">
            <p>対象種目をお選びください</p>
            <p style="margin-top: 0.5rem; font-size: 0.9rem;">
                女子: VT, UB, BB, FX | 男子: FX, PH, SR, VT, PB, HB
            </p>
            <p style="margin-top: 2rem; font-size: 0.75rem; opacity: 0.8;">
                2025-2028年FIG採点規則対応<br>
                MAG NL1-3 (2025) / WAG NL1 (2026/2) 反映
            </p>
            <p style="margin-top: 0.3rem; font-size: 0.65rem; opacity: 0.7;">
                制作: Kaito-Imadu with Claude Code
            </p>
        </div>
    </div>
</body>
</html>
