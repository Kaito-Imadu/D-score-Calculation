<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!--
    Star jump (スタージャンプ) silhouette:
    両腕を斜め上に広げ、両足を斜め下に開いた左右対称の星形ポーズ。
    stroke-width=26 → 48px時に約2.4px、十分な視認性。
    stroke-linecap=round で関節がなめらか。
  -->
  <g stroke="white" stroke-width="26" stroke-linecap="round" fill="none">
    <!-- 体幹 -->
    <line x1="256" y1="94"  x2="256" y2="226"/>
    <!-- 左腕: 肩(244,118) → 左上手先(114,43) / 水平から約30°上 -->
    <line x1="244" y1="118" x2="114" y2="43"/>
    <!-- 右腕: 肩(268,118) → 右上手先(398,43) -->
    <line x1="268" y1="118" x2="398" y2="43"/>
    <!-- 左足: 股関節(244,225) → 左下足先(145,324) / 鉛直から約45° -->
    <line x1="244" y1="225" x2="145" y2="324"/>
    <!-- 右足: 股関節(268,225) → 右下足先(367,324) -->
    <line x1="268" y1="225" x2="367" y2="324"/>
  </g>

  <!-- 頭部 (塗りつぶし円で確実にスケール) -->
  <circle cx="256" cy="60" r="33" fill="white"/>

  <!-- セパレーター -->
  <line x1="104" y1="356" x2="408" y2="356"
        stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- D : 機能を一文字で示す -->
  <text x="256" y="442"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="80" font-weight="900"
        text-anchor="middle" fill="white">D</text>

  <!-- SCORE : 補足ラベル(大サイズ時のみ可読) -->
  <text x="256" y="478"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" text-anchor="middle"
        fill="rgba(255,255,255,0.68)" letter-spacing="5">SCORE</text>
</svg>
