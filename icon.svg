<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Score display (scoreboard element) -->
  <rect x="140" y="22" width="170" height="62" rx="14"
        fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <text x="225" y="66" font-family="'Arial Black', Arial, sans-serif"
        font-size="32" font-weight="900" text-anchor="middle" fill="white">D 6.4</text>

  <!-- Lightning bolt (auto-calculation) -->
  <path d="M325,22 L342,22 L332,52 L345,52 L318,92 L328,58 L314,58 Z"
        fill="rgba(255,255,255,0.82)"/>

  <!-- Rondaat stick figure: body diagonal, one hand planted, legs split high -->
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round"
     fill="none" stroke-width="19">
    <!-- Head (hanging near planted hand) -->
    <circle cx="298" cy="351" r="24"/>
    <!-- Right arm: planted hand → shoulder -->
    <line x1="347" y1="399" x2="271" y2="301"/>
    <!-- Left arm: lifted hand → shoulder -->
    <line x1="175" y1="362" x2="266" y2="298"/>
    <!-- Body: shoulder → hips -->
    <line x1="268" y1="298" x2="250" y2="205"/>
    <!-- Left leg: hips → upper-left (split) -->
    <line x1="250" y1="205" x2="139" y2="102"/>
    <!-- Right leg: hips → upper-right (split) -->
    <line x1="250" y1="205" x2="370" y2="109"/>
  </g>

  <!-- Hands -->
  <circle cx="347" cy="399" r="12" fill="white"/>
  <circle cx="175" cy="362" r="12" fill="white"/>
  <!-- Feet -->
  <circle cx="135" cy="98"  r="12" fill="white"/>
  <circle cx="374" cy="105" r="12" fill="white"/>
</svg>
